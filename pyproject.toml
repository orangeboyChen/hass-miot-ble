[project]
name = "hass-miot-ble"
version = "0.5.0"
description = "Local Xiaomi MIoT BLE control for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = [
    "bleak-retry-connector>=4.7.1",
    "cryptography>=43.0.0",
    "xiaomi-ble==1.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=5.0.0",
    "pytest-homeassistant-custom-component==0.13.372",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
addopts = "--cov=custom_components.miot_ble --cov-branch --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["custom_components.miot_ble"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
